<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drill 1 Evangelio</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe4e6; 
            padding: 40px;
            max-width: 400px;
            margin: auto;
            border: 1px solid #f5c2c7; 
            box-shadow: 0 0 10px #f5c2c7; 
            margin-top: 50px;
        }

        h2 {
            text-align: center;
            color: #d88a8f; 
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #f5c2c7;
            border-radius: 5px;
            font-size: 16px;
            background-color: #ffeef0; 
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #f8d7da; 
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #ffe4e6; 
        }

        p {
            font-size: 16px;
            margin-top: 10px;
        }

        #average, #result {
            font-weight: bold;
            color: #d88a8f; 
        }
    
    </style>

</head>
<body>
    <h2>Simple Average Calculator</h2>

    <p>Score 1:</p>
    <input id="score1" type="text">

    <p>Score 2:</p>
    <input id="score2" type="text">

    <button py-click="compute_average">Compute</button>

    <p>Average: <span id="average"></span></p>
    <p>Passed? <span id="result"></span></p>

    <script type="py" src="main.py"></script>
</body>
</html>
